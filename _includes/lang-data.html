<script>
window.__langData = {
  posts: [
    {%- for post in site.posts -%}
    {%- if post.ref and post.lang -%}
    { "ref": "{{ post.ref }}", "lang": "{{ post.lang }}", "url": "{{ post.url | relative_url }}", "title": "{{ post.title | escape }}" },
    {%- endif -%}
    {%- endfor -%}
  ],
  pages: [
    {%- for pg in site.pages -%}
    {%- if pg.ref and pg.lang -%}
    { "ref": "{{ pg.ref }}", "lang": "{{ pg.lang }}", "url": "{{ pg.url | relative_url }}" },
    {%- endif -%}
    {%- endfor -%}
  ]
};
</script>
